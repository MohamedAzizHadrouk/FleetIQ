[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Storybook/Vitest tooling pulls in Playwright; don't download browsers on Netlify.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Single-page app: send unknown routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
